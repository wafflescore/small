<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyboard Tools</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 100%);
      color: #0f172a;
    }

    .card {
      width: min(92vw, 560px);
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      padding: 32px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 20px;
      color: #475569;
      line-height: 1.6;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    a {
      display: block;
      padding: 14px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      background: #2563eb;
      color: white;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    a:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Keyboard Tools</h1>
    <p>Select a page to continue.</p>
    <div class="links">
      <a href="enth.html">Thai-English Keyboard Converter</a>
    </div>
  </main>
</body>
</html>
